{% extends 'cake_recipes/base.html' %}

{% block content %}

  <p>Cake: {{ recipe.text }}</p>

  <p>Recipe:</p>
  <ul>
    {% for item in recipe_items %}
      <li>{{ item.text }}</li>
    {% empty %}
      <li>No items have been added to this cake yet.</li>
    {% endfor %}
  </ul>
  
{% endblock content %}
